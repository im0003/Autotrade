name: collect-us
on:
  workflow_dispatch:
  schedule:
    - cron: "40 21 * * 1-5"
    - cron: "10 22 * * 1-5"
    - cron: "10 23 * * 1-5"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: collect
        run: node scripts/collect-us.mjs us.json
      - name: save
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add us.json
          git diff --cached --quiet || (git commit -m "us update" && git push)
