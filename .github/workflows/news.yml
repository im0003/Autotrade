name: collect-news
# 뉴스(RSS)·공시(DART)를 모아 news.json으로 저장합니다. 앱은 같은 사이트의 news.json을 읽습니다.
# 주의: GitHub 스케줄은 몇 분 늦을 수 있고, 저장소가 60일간 활동이 없으면 자동으로 멈춥니다(Actions 탭에서 다시 켜기).
# 시간은 모두 UTC입니다(한국 = UTC+9).
on:
  schedule:
    - cron: "*/30 20,21 * * 1-5"     # 한국 화~토 05:00~07:00 (미국 마감 직후 — 토요일 새벽 포함)
    - cron: "*/10 22,23 * * 0-5"     # 한국 월~토 07:00~09:00
    - cron: "*/10 0-7 * * 1-5"       # 한국 월~금 09:00~17:00 (장중)
    - cron: "*/30 8-14 * * 1-5"      # 한국 월~금 17:00~24:00 (장 마감 후 공시·NXT 애프터·다음날 준비)
    - cron: "0 */3 * * 0,6"          # 주말 3시간마다
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collect-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/collect-news.mjs news.json
      - name: 변경 시 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "news update" && git push)
