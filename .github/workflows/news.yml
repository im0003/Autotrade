name: collect-news
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 22,23 * * 0-4"
    - cron: "*/10 0-7 * * 1-5"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/collect-news.mjs news.json
      - name: save
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "news update" && git push)
