name: export-probe
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "조회 목록 (코드:국가:시작-끝, 쉼표로 구분). 비우면 기본 목록"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PROBE: ${{ github.event.inputs.probe }}
        run: node scripts/probe-export.mjs
